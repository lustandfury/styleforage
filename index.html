    <!-- PWA Manifest - dynamically created as blob URL for lookbook pages -->
    <link rel="manifest" href="/manifest.json" id="pwamanifest" />
    <script>
      (function() {
        var match = /^\/lookbook\/([^/?#]+)/.exec(window.location.pathname);
        if (!match) return;
        
        var slug = match[1];
        var title = slug.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
        var startUrl = '/lookbook/' + slug;
        
        // Detect iOS
        var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        
        if (isIOS) {
          // On iOS: Remove apple-mobile-web-app-capable so Safari creates a simple
          // bookmark that opens the exact current URL, not a PWA with cached start_url
          var appleCapable = document.getElementById('apple-capable');
          if (appleCapable) appleCapable.remove();
          
          // Update the title for the home screen icon
          var appleTitle = document.getElementById('apple-title');
          if (appleTitle) appleTitle.content = title;
          
          // Remove manifest - iOS doesn't use it reliably for bookmarks anyway
          var link = document.getElementById('pwamanifest');
          if (link) link.remove();
        } else {
          // On desktop/Android: Use blob manifest with correct start_url for PWA install
          var manifest = {
            id: 'styleforage-lookbook-' + slug,
            name: 'Lookbook - ' + title,
            short_name: title,
            description: 'Your personalized style lookbook by Roz',
            start_url: startUrl,
            scope: startUrl,
            display: 'standalone',
            background_color: '#FAF9F7',
            theme_color: '#1c1917',
            orientation: 'portrait-primary',
            icons: [
              { src: '/images/favicon.png', sizes: '32x32', type: 'image/png' },
              { src: '/images/app-icon.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          
          var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
          var manifestUrl = URL.createObjectURL(blob);
          
          var link = document.getElementById('pwamanifest');
          if (link) link.href = manifestUrl;
        }
      })();
    </script>
