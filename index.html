    <!-- PWA Manifest - slug set by script when on /lookbook/:slug so Install opens that lookbook -->
    <link rel="manifest" href="/manifest.json" id="pwamanifest" />
    <script>
      (function() {
        var m = /^\/lookbook\/([^/?#]+)/.exec(window.location.pathname);
        if (m) {
          var link = document.getElementById('pwamanifest') || document.querySelector('link[rel="manifest"]');
          if (link) link.href = '/manifest.json?slug=' + encodeURIComponent(m[1]);
        }
      })();
    </script>
