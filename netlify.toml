[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = true
  framework = "#custom"

# API redirects - proxy to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Dynamic PWA manifest so Add to Home Screen from a lookbook uses that lookbook URL
[[redirects]]
  from = "/manifest.json"
  to = "/.netlify/functions/manifest"
  status = 200
  force = true
