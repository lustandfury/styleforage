[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = true
  framework = "#custom"

# API redirects - proxy to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Dynamic PWA manifest so Add to Home Screen from a lookbook uses that lookbook URL
[[redirects]]
  from = "/manifest.json"
  to = "/.netlify/functions/manifest"
  status = 200
  force = true

# Edge function to rewrite manifest link in HTML for lookbook pages
[[edge_functions]]
  function = "lookbook-manifest"
  path = "/lookbook/*"

# Cache headers
[[headers]]
  # Vite's content-hashed build output - safe to cache forever
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Static images in public/images are unhashed - revalidate so replacements aren't pinned stale
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
